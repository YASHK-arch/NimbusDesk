[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "venturetwin"
version = "0.1.0"
description = "VentureTwin: SaaS Decision Stress-Test & Multi-Agent Swarm Orchestration Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "networkx>=3.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "requires_cassettes: marks tests requiring pre-recorded LLM cassettes"
]
addopts = "-m 'not requires_cassettes'"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "api*", "conflict*", "orchestrator*", "report*", "simulation*", "state*", "verification*"]
exclude = ["tests*", "docs*", "ui*"]
